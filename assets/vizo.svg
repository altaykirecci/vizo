<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2230"/>
      <stop offset="100%" stop-color="#0f1118"/>
    </linearGradient>
    <linearGradient id="apertureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgGrad)" stroke="#374151" stroke-width="3"/>

  <!-- Camera Lens Outer Ring -->
  <circle cx="128" cy="128" r="76" fill="none" stroke="#252936" stroke-width="10"/>
  <circle cx="128" cy="128" r="64" fill="none" stroke="url(#apertureGrad)" stroke-width="5" filter="url(#glow)"/>

  <!-- Aperture / Shutter Blades (Stylized V / Lens Geometry) -->
  <path d="M 128 72 L 168 128 L 128 184 L 88 128 Z" fill="none" stroke="#60a5fa" stroke-width="4"/>
  <circle cx="128" cy="128" r="24" fill="url(#apertureGrad)"/>
  
  <!-- Subtle Sensor / RAW corner markers -->
  <path d="M 56 70 L 56 56 L 70 56" stroke="#9ca3af" stroke-width="3" fill="none"/>
  <path d="M 200 70 L 200 56 L 186 56" stroke="#9ca3af" stroke-width="3" fill="none"/>
  <path d="M 56 186 L 56 200 L 70 200" stroke="#9ca3af" stroke-width="3" fill="none"/>
  <path d="M 200 186 L 200 200 L 186 200" stroke="#9ca3af" stroke-width="3" fill="none"/>
</svg>
